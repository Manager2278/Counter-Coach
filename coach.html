<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Counter Coach</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <meta name="theme-color" content="#006400">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f0; min-height: 100vh; }
    .header { background: #006400; color: white; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .header h2 { font-size: 18px; letter-spacing: 0.5px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    #header-info { font-size: 12px; opacity: 0.85; text-align: right; line-height: 1.4; }
    .btn-mgr-setup { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.75); background: none; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
    .btn-mgr-setup:hover { color: white; border-color: rgba(255,255,255,0.7); }
    .wrap { max-width: 540px; margin: 0 auto; padding: 20px 16px 40px; }
    .screen { display: none; }
    .screen.active { display: block; }
    /* ── CARDS */
    .setup-box, .home-box, .q-box { background: white; border-radius: 14px; padding: 28px 24px; box-shadow: 0 3px 16px rgba(0,0,0,0.1); margin-top: 16px; }
    .setup-box h3 { font-size: 20px; color: #1a3a1a; margin-bottom: 6px; }
    .setup-box > p { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; }
    input[type=text], input[type=tel], input[type=password] { width: 100%; padding: 11px 14px; margin: 6px 0 14px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 15px; font-family: Arial, sans-serif; background: #fafafa; transition: border .2s; }
    input:focus { outline: none; border-color: #006400; background: white; }
    .field-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #888; display: block; }
    .btn { display: block; width: 100%; padding: 14px; margin: 8px 0; font-weight: bold; font-size: 15px; border: none; border-radius: 10px; cursor: pointer; transition: filter .15s, transform .1s; text-align: center; text-decoration: none; }
    .btn:active { transform: scale(0.98); }
    .btn-green { background: #2e7d32; color: white; }
    .btn-blue { background: #1b5e20; color: white; }
    .btn-red { background: #c62828; color: white; }
    .btn-gray { background: #757575; color: white; }
    .btn-emergency { background: #b71c1c; color: white; }
    .btn-navy { background: #1565c0; color: white; }
    .btn-amber { background: #e65100; color: white; }
    .err-box { background: #ffebee; border: 1px solid #ffcdd2; color: #c62828; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; display: none; }
    .err-box.show { display: block; }
    .home-box p { font-size: 16px; font-weight: bold; color: #1a3a1a; margin-bottom: 14px; }
    hr { border: none; border-top: 1px solid #e8e8e8; margin: 10px 0; }
    .q-box p { font-size: 18px; font-weight: bold; color: #1a2a1a; margin-bottom: 18px; line-height: 1.4; }
    .result { padding: 18px; border-radius: 10px; font-size: 20px; font-weight: bold; }
    .call { background: #ffebee; color: #c62828; }
    .nocall { background: #e8f5e9; color: #2e7d32; }
    .why { color: #b71c1c; margin-top: 12px; font-weight: bold; font-size: 15px; line-height: 1.5; }
    .ask { margin-top: 10px; font-size: 14px; line-height: 1.5; }
    .expect { color: #1b5e20; margin-top: 12px; font-weight: bold; font-style: italic; font-size: 15px; line-height: 1.5; }
    #error-banner { display: none; background: #ffcccc; color: #900; padding: 10px 14px; border-radius: 8px; margin: 12px 16px; font-size: 13px; }
    #broadcast-banner { display: none; background: #1b5e20; color: white; padding: 10px 16px; font-size: 13px; line-height: 1.5; }
    #broadcast-banner.show { display: block; }
    #broadcast-banner strong { display: block; font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    /* ── REG CODE FIELD — hidden by default, shown only for new stores */
    .reg-code-wrap { display: none; background: #fff8e1; border: 1.5px solid #ffe082; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
    .reg-code-wrap.show { display: block; }
    .reg-code-wrap p { font-size: 12px; color: #7a5800; margin-bottom: 8px; line-height: 1.5; }
    .reg-code-wrap input { margin: 0; background: white; }
    .store-status { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 6px; display: inline-block; margin-bottom: 10px; }
    .store-status.new { background: #e8f5e9; color: #2e7d32; }
    .store-status.exists { background: #e3f2fd; color: #1565c0; }
    /* ── LOCKED MANAGER FIELDS */
    input.mgr-locked { background: #f5f5f5 !important; color: #9e9e9e !important; border-color: #e0e0e0 !important; cursor: default !important; }
    #mgr-lock-notice { display: none; align-items: center; justify-content: space-between; gap: 8px; background: #f5f5f5; border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; font-size: 12px; color: #757575; }
    #mgr-lock-notice.show { display: flex; }
    .btn-unlock { font-size: 12px; font-weight: 700; color: #1565c0; background: none; border: 1.5px solid #1565c0; border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    /* ── AVATAR */
    .topbar-avatar { width:30px; height:30px; border-radius:50%; border:2px solid rgba(255,255,255,0.4); background:rgba(255,255,255,0.15); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; padding:0; overflow:hidden; flex-shrink:0; transition:border-color .15s; }
    .topbar-avatar:hover { border-color:rgba(255,255,255,0.8); }
    .topbar-avatar img { width:100%; height:100%; object-fit:cover; }
    /* nav injected by js/nav.js */
  </style>
</head>
<body>
  <div class="header" id="main-header">
    <h2 id="header-brand">
      <img id="header-logo-img" src="" alt="Logo" style="max-height:30px;vertical-align:middle;border-radius:4px;display:none;">
      <span id="header-brand-text"><img src="icon-192.png" alt="" style="height:20px;width:20px;border-radius:3px;vertical-align:middle;margin-right:6px;object-fit:cover;"> Counter Coach</span>
    </h2>
    <div class="header-right">
      <div id="header-info"></div>
      <button class="topbar-avatar" id="tb-avatar-btn" onclick="openAvatarModal()" title="My profile picture" style="display:none;">
        <img id="tb-avatar-img" src="" alt="" style="display:none;">
        <span id="tb-avatar-placeholder">👤</span>
      </button>
    </div>
  </div>

  <!-- Broadcast banner -->
  <div id="broadcast-banner"></div>

  <div id="error-banner"></div>

  <div class="wrap">
    <!-- HOME -->
    <div class="screen active" id="screen-home">
      <div class="home-box">
        <p>What is the situation?</p>
        <button class="btn btn-emergency" onclick="emergency()">&#x1F6A8; Emergency</button>
        <button class="btn btn-blue" onclick="nextQ('cust1')">Customer Escalation</button>
        <button class="btn btn-blue" onclick="nextQ('staff1')">Staffing Issue</button>
        <button class="btn btn-blue" onclick="nextQ('driver1')">Drivers / Delivery</button>
        <button class="btn btn-blue" onclick="nextQ('cash1')">Cash / Variance</button>
        <button class="btn btn-blue" onclick="nextQ('ops1')">System / Store Issue</button>
        <a class="btn btn-amber" href="rules.html">&#x1F4D6; Counter Rules &amp; Training</a>
        <hr>
        <a class="btn btn-navy" href="/">&#x1F4CB; Daily Recap &amp; Log</a>
      </div>
    </div>

    <!-- QUESTION SCREEN -->
    <div class="screen" id="screen-q">
      <div class="q-box" id="q-inner"></div>
    </div>

    <!-- RESULT SCREEN -->
    <div class="screen" id="screen-result">
      <div class="q-box">
        <div id="resultText" class="result"></div>
        <div id="why" class="why"></div>
        <div id="ask" class="ask"></div>
        <div id="expect" class="expect"></div>
        <div id="actionBtn" style="margin-top:14px;"></div>
        <button class="btn btn-gray" style="margin-top:12px;" onclick="goHome()">&#x2190; Home</button>
      </div>
    </div>
  </div>
  <footer style="text-align:center; font-size:10px; margin-top:20px; color:#555;">
   Counter Coach © 2026 Justin Thomas • Internal Use Only • Unauthorized commercial use prohibited
  </footer>

<!-- nav injected by js/nav.js via js/index.js -->

<!-- ══════════════ AVATAR MODAL ════════════════════════════════ -->
<div id="avatar-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:400;align-items:center;justify-content:center;" onclick="closeAvatarModal()">
  <div style="background:white;border-radius:16px;padding:24px 20px;max-width:320px;width:90%;text-align:center;" onclick="event.stopPropagation()">
    <h3 style="font-size:17px;font-weight:700;margin:0 0 6px;">My Avatar</h3>
    <p style="font-size:13px;color:#888;margin:0 0 16px;">Choose a photo to use as your avatar.</p>
    <div style="margin-bottom:14px;">
      <img id="avatar-current-img" src="" alt="" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #1e6b36;display:none;margin:0 auto 8px;">
      <div id="avatar-placeholder-circle" style="width:100px;height:100px;border-radius:50%;background:#e6f4ea;border:3px dashed #8ab89a;display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 8px;">👤</div>
    </div>
    <div id="avatar-status" style="font-size:13px;color:#888;min-height:18px;margin-bottom:12px;"></div>
    <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" onchange="handleAvatarFileChosen(this)">
    <div style="display:flex;flex-direction:column;gap:8px;">
      <label for="avatar-file-input" style="display:block;text-align:center;cursor:pointer;padding:10px;background:#e6f4ea;border:1.5px solid #1e6b36;border-radius:10px;font-size:14px;font-weight:700;color:#1e6b36;">📷 Choose / Take Photo</label>
      <button id="avatar-use-btn"    onclick="usePhotoAsIs()"  style="display:none;padding:10px;background:#4a90d9;border:none;border-radius:10px;font-size:14px;font-weight:700;color:white;cursor:pointer;">📷 Use Photo As-Is</button>
      <button id="avatar-remove-btn" onclick="removeMyAvatar()" style="display:none;padding:9px;background:#fff0f0;border:1.5px solid #e55;border-radius:10px;font-size:14px;font-weight:700;color:#c00;cursor:pointer;">🗑️ Remove Avatar</button>
      <button onclick="closeAvatarModal()" style="padding:9px;background:#f5f0e8;border:1.5px solid #ccc;border-radius:10px;font-size:14px;cursor:pointer;">Close</button>
    </div>
  </div>
</div>

<script type="module" src="js/index.js?v=3"></script>
</body>
</html>
