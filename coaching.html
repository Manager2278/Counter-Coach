<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Coaching - O'Reilly Style</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
}

.header {
  background: #006400;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.container {
  padding: 15px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

h3 {
  margin-top: 0;
  color: #006400;
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  margin-bottom: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.checkbox-group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button {
  width: 100%;
  padding: 15px;
  background: #FFD700;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

canvas {
  border: 1px solid #ccc;
  border-radius: 8px;
  width: 100%;
  height: 150px;
}

.sig-buttons {
  display: flex;
  gap: 10px;
}

.sig-buttons button {
  flex: 1;
  padding: 8px;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="header">
Employee Coaching Form
</div>

<div class="container">

<div class="card">
<h3>Employee Info</h3>
<input id="empName" placeholder="Employee Name">
<input id="empId" placeholder="Employee ID">
<input id="store" placeholder="Store Number">
<input id="manager" placeholder="Manager Name">
<input id="date" type="date">
</div>

<div class="card">
<h3>Incident Description</h3>
<textarea id="incident"></textarea>
</div>

<div class="card">
<h3>Expected Standard</h3>
<textarea id="expected"></textarea>
</div>

<div class="card">
<h3>Corrective Action</h3>
<textarea id="action"></textarea>
</div>

<div class="card">
<h3>Employee Signature</h3>
<canvas id="empSig"></canvas>
<div class="sig-buttons">
<button onclick="clearPad(empSigPad)">Clear</button>
</div>
</div>

<div class="card">
<h3>Manager Signature</h3>
<canvas id="mgrSig"></canvas>
<div class="sig-buttons">
<button onclick="clearPad(mgrSigPad)">Clear</button>
</div>
</div>

<button onclick="submitForm()">Submit Coaching</button>

</div>

<script>
function SignaturePad(canvas) {
  this.canvas = canvas;
  this.ctx = canvas.getContext("2d");
  this.drawing = false;

  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;

  canvas.addEventListener("mousedown", e => {
    this.drawing = true;
    this.ctx.beginPath();
    this.ctx.moveTo(e.offsetX, e.offsetY);
  });

  canvas.addEventListener("mousemove", e => {
    if (!this.drawing) return;
    this.ctx.lineTo(e.offsetX, e.offsetY);
    this.ctx.stroke();
  });

  canvas.addEventListener("mouseup", () => this.drawing = false);
  canvas.addEventListener("mouseleave", () => this.drawing = false);

  // Touch support
  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    this.drawing = true;
    this.ctx.beginPath();
    this.ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
  });

  canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!this.drawing) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    this.ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
    this.ctx.stroke();
  });

  canvas.addEventListener("touchend", () => this.drawing = false);

  this.clear = function() {
    this.ctx.clearRect(0, 0, canvas.width, canvas.height);
  };

  this.getData = function() {
    return canvas.toDataURL();
  };
}

const empSigPad = new SignaturePad(document.getElementById("empSig"));
const mgrSigPad = new SignaturePad(document.getElementById("mgrSig"));

function clearPad(pad){
  pad.clear();
}

function submitForm(){
  const data = {
    employee: document.getElementById("empName").value,
    manager: document.getElementById("manager").value,
    incident: document.getElementById("incident").value,
    expected: document.getElementById("expected").value,
    action: document.getElementById("action").value,
    empSignature: empSigPad.getData(),
    mgrSignature: mgrSigPad.getData()
  };

  console.log("Form Data:", data);
  alert("Coaching submitted with signatures ✔️");
}
</script>

</body>
</html>
