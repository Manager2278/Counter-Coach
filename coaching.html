<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Coaching - O'Reilly Style</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin: 0;
}

.header {
  background: #006400;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.container {
  padding: 15px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

h3 {
  margin-top: 0;
  color: #006400;
}

input, textarea, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  margin-bottom: 10px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.checkbox-group {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.checkbox-group label {
  font-size: 14px;
}

button {
  width: 100%;
  padding: 15px;
  background: #FFD700;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
}

canvas {
  border: 1px solid #ccc;
  border-radius: 8px;
  width: 100%;
  height: 150px;
}

.sig-buttons {
  display: flex;
  gap: 10px;
}

.sig-buttons button {
  flex: 1;
  padding: 8px;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="header">
Employee Coaching Form
</div>

<div class="container">

<div class="card">
<h3>Employee Info</h3>
<input id="empName" placeholder="Employee Name">
<input id="empId" placeholder="Employee ID">
<input id="store" placeholder="Store Number">
<input id="manager" placeholder="Manager Name">
<input id="date" type="date">
</div>

<div class="card">
<h3>Type of Coaching</h3>
<select id="type">
<option>Verbal Coaching</option>
<option>Written Warning</option>
<option>Final Warning</option>
<option>Policy Violation</option>
<option>Performance Improvement</option>
</select>
</div>

<div class="card">
<h3>Reason for Coaching</h3>
<div class="checkbox-group">
<label><input type="checkbox" value="Customer Service"> Customer Service</label>
<label><input type="checkbox" value="Parts Lookup Error"> Parts Lookup Error</label>
<label><input type="checkbox" value="Core Charge Violation"> Core Charge Violation</label>
<label><input type="checkbox" value="Warranty Violation"> Warranty Violation</label>
<label><input type="checkbox" value="Procedures"> Procedures</label>
<label><input type="checkbox" value="Attendance"> Attendance</label>
<label><input type="checkbox" value="Cash Handling"> Cash Handling</label>
<label><input type="checkbox" value="Conduct"> Conduct</label>
</div>
</div>

<div class="card">
<h3>Incident Description</h3>
<textarea id="incident"></textarea>
</div>

<div class="card">
<h3>Expected Standard</h3>
<textarea id="expected"></textarea>
</div>

<div class="card">
<h3>Impact</h3>
<div class="checkbox-group">
<label><input type="checkbox" value="Loss of Sale"> Loss of Sale</label>
<label><input type="checkbox" value="Financial Loss"> Financial Loss</label>
<label><input type="checkbox" value="Customer Issue"> Customer Issue</label>
<label><input type="checkbox" value="Policy Risk"> Policy Risk</label>
<label><input type="checkbox" value="Safety"> Safety</label>
</div>
</div>

<div class="card">
<h3>Corrective Action</h3>
<textarea id="action"></textarea>
</div>

<div class="card">
<h3>Follow-Up</h3>
<select id="followup">
<option>Immediate</option>
<option>7 Days</option>
<option>30 Days</option>
</select>
</div>

<div class="card">
<h3>Employee Comments</h3>
<textarea id="comments"></textarea>
</div>

<div class="card">
<h3>Employee Signature</h3>
<canvas id="empSig"></canvas>
<div class="sig-buttons">
<button onclick="clearPad(empSigPad)">Clear</button>
</div>
</div>

<div class="card">
<h3>Manager Signature</h3>
<canvas id="mgrSig"></canvas>
<div class="sig-buttons">
<button onclick="clearPad(mgrSigPad)">Clear</button>
</div>
</div>

<button onclick="submitForm()">Submit Coaching</button>

</div>

<script>
function getCheckedValues(container){
  return Array.from(container.querySelectorAll("input:checked"))
    .map(cb => cb.value);
}

function SignaturePad(canvas) {
  this.canvas = canvas;
  this.ctx = canvas.getContext("2d");
  this.drawing = false;

  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;

  canvas.addEventListener("mousedown", e => {
    this.drawing = true;
    this.ctx.beginPath();
    this.ctx.moveTo(e.offsetX, e.offsetY);
  });

  canvas.addEventListener("mousemove", e => {
    if (!this.drawing) return;
    this.ctx.lineTo(e.offsetX, e.offsetY);
    this.ctx.stroke();
  });

  canvas.addEventListener("mouseup", () => this.drawing = false);
  canvas.addEventListener("mouseleave", () => this.drawing = false);

  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    this.drawing = true;
    this.ctx.beginPath();
    this.ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
  });

  canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!this.drawing) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    this.ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
    this.ctx.stroke();
  });

  canvas.addEventListener("touchend", () => this.drawing = false);

  this.clear = function() {
    this.ctx.clearRect(0, 0, canvas.width, canvas.height);
  };

  this.getData = function() {
    return canvas.toDataURL();
  };
}

const empSigPad = new SignaturePad(document.getElementById("empSig"));
const mgrSigPad = new SignaturePad(document.getElementById("mgrSig"));

function submitForm(){
  const reason = getCheckedValues(document.querySelector(".card:nth-of-type(3)"));
  const impact = getCheckedValues(document.querySelector(".card:nth-of-type(6)"));

  const data = {
    employee: empName.value,
    type: type.value,
    reason,
    impact,
    incident: incident.value,
    expected: expected.value,
    action: action.value,
    comments: comments.value,
    empSignature: empSigPad.getData(),
    mgrSignature: mgrSigPad.getData()
  };

  console.log(data);
  alert("Coaching submitted with full data ✔️");
}

function clearPad(pad){
  pad.clear();
}
</script>

</body>
</html>
