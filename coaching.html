<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coaching System Elite</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#f4f4f4; margin:0; }
.header { background:#006400; color:white; padding:15px; text-align:center; }
.container { padding:15px; }
.card { background:white; padding:15px; border-radius:10px; margin-bottom:15px; }
button { width:100%; padding:12px; background:#FFD700; border:none; border-radius:10px; }
canvas { width:100%; height:150px; border:1px solid #ccc; }
.stat { font-weight:bold; margin:5px 0; }
</style>
</head>

<body>

<div class="header" id="header"></div>

<div class="container">

<div class="card">
<h3>New Coaching</h3>
<input id="empName" placeholder="Employee Name">

<select id="issue">
<option>Core Charge Violation</option>
<option>Warranty Violation</option>
<option>Customer Service</option>
<option>Lookup Error</option>
<option>Cash Handling</option>
</select>

<textarea id="incident" placeholder="Incident"></textarea>
<textarea id="action" placeholder="Corrective Action"></textarea>
</div>

<div class="card">
<h3>Employee Signature</h3>
<canvas id="empSig"></canvas>
<button onclick="empPad.clear()">Clear</button>
</div>

<div class="card">
<h3>Manager Signature</h3>
<canvas id="mgrSig"></canvas>
<button onclick="mgrPad.clear()">Clear</button>
</div>

<button onclick="save()">Save + PDF</button>

<div class="card" id="dashboard"></div>
<div class="card" id="qr"></div>

</div>

<script>
// SESSION
const store = localStorage.getItem("store");
const manager = localStorage.getItem("manager");

document.getElementById("header").innerText = `Store ${store} - ${manager}`;

// FIREBASE
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// SIGN PAD
function Sig(c){
  this.ctx=c.getContext("2d"); this.draw=false;
  c.width=c.offsetWidth; c.height=c.offsetHeight;

  c.onmousedown=e=>{this.draw=true;this.ctx.beginPath();this.ctx.moveTo(e.offsetX,e.offsetY);}
  c.onmousemove=e=>{if(!this.draw)return;this.ctx.lineTo(e.offsetX,e.offsetY);this.ctx.stroke();}
  c.onmouseup=()=>this.draw=false;

  this.clear=()=>this.ctx.clearRect(0,0,c.width,c.height);
  this.get=()=>c.toDataURL();
}

const empPad=new Sig(empSig);
const mgrPad=new Sig(mgrSig);

// SAVE
async function save(){
  const name = empName.value;

  const snapshot = await db.collection("coaching")
    .where("store","==",store)
    .where("name","==",name)
    .get();

  const count = snapshot.size;

  const level = count >=2 ? "Final Warning" :
                count ===1 ? "Written Warning" : "Verbal Coaching";

  const data = {
    store, manager, name,
    issue: issue.value,
    type: level,
    incident: incident.value,
    action: action.value,
    empSig: empPad.get(),
    mgrSig: mgrPad.get(),
    date: Date.now()
  };

  await db.collection("coaching").add(data);

  generatePDF(data);

  alert("Saved ✔️");

  loadDashboard();
}

// 📊 DASHBOARD + INTELLIGENCE
async function loadDashboard(){
  const snapshot = await db.collection("coaching")
    .where("store","==",store)
    .get();

  let issues = {};
  let repeats = {};

  snapshot.forEach(doc=>{
    let d = doc.data();

    issues[d.issue] = (issues[d.issue]||0)+1;
    repeats[d.name] = (repeats[d.name]||0)+1;
  });

  let topIssue = Object.keys(issues).sort((a,b)=>issues[b]-issues[a])[0];

  let repeatList = Object.keys(repeats)
    .filter(n=>repeats[n] >=3)
    .map(n=>`${n} (${repeats[n]})`)
    .join("<br>");

  document.getElementById("dashboard").innerHTML = `
    <h3>Dashboard</h3>
    <div class="stat">Top Issue: ${topIssue || "None"}</div>
    <div class="stat">Repeat Offenders:<br>${repeatList || "None"}</div>
  `;
}

// 🖨️ BRANDED PDF
function generatePDF(d){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(16);
  doc.text("O'Reilly Auto Parts Coaching Form",20,20);

  doc.setFontSize(12);
  doc.text(`Employee: ${d.name}`,20,40);
  doc.text(`Manager: ${d.manager}`,20,50);
  doc.text(`Type: ${d.type}`,20,60);
  doc.text(`Issue: ${d.issue}`,20,70);

  doc.text("Incident:",20,90);
  doc.text(d.incident,20,100);

  doc.text("Action:",20,120);
  doc.text(d.action,20,130);

  doc.addImage(d.empSig,"PNG",20,150,60,30);
  doc.addImage(d.mgrSig,"PNG",100,150,60,30);

  doc.save(`${d.name}_coaching.pdf`);
}

// 📱 QR GENERATOR
new QRCode(document.getElementById("qr"), {
  text: window.location.href,
  width: 128,
  height: 128
});

// INIT
loadDashboard();
</script>

</body>
</html>
