<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager Decision Coach</title>

<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; text-align:center; }
.header { background:#1b5e20; color:white; padding:15px; border-radius:10px; margin-bottom:15px; cursor:pointer; }
.container { background:white; max-width:480px; margin:auto; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
p { font-size:18px; font-weight:bold; cursor:pointer; }
.btn { display:block; width:100%; padding:14px; margin:10px 0; font-weight:bold; border:none; border-radius:8px; cursor:pointer;}
.btn-yes{background:#2e7d32;color:white;}
.btn-no{background:#c62828;color:white;}
.btn-blue{background:#1565c0;color:white;}
.btn-reset{background:#777;color:white;}
.hidden{display:none;}
.result{padding:20px;font-weight:bold;border-radius:8px;}
.call{background:#ffebee;color:#c62828;border:2px solid #c62828;}
.nocall{background:#e8f5e9;color:#2e7d32;border:2px solid #2e7d32;}
.footer{margin-top:15px;font-size:12px;color:#666;}
.action-btn{width:auto;padding:10px 16px;display:inline-block;}
</style>
</head>

<body>

<div class="header" onclick="goHome()">
<h2>Manager Coach</h2>
</div>

<div class="container">

<!-- MAIN (CLICKABLE RESET) -->
<div id="q1">
<p onclick="goHome()">🚨 Emergency situation?</p>
<button class="btn btn-yes" onclick="showResult('CALL 911 FIRST,<br>Call DM SECOND','tel:911')">YES</button>
<button class="btn btn-no" onclick="nextQ('q2')">NO</button>
</div>

<!-- ISSUE TYPE (INLINE NOW) -->
<div id="q2" class="hidden">
<p onclick="goHome()">What type of issue?</p>
<button class="btn btn-blue" onclick="nextQ('q-staff')">Staffing</button>
<button class="btn btn-blue" onclick="nextQ('q-customer')">Customer</button>
<button class="btn btn-blue" onclick="nextQ('q-ops')">Operations</button>
<button class="btn btn-blue" onclick="nextQ('q-financial')">Financial</button>
<button class="btn btn-reset" onclick="goBack()">Back</button>
</div>

<!-- STAFF -->
<div id="q-staff" class="hidden">
<p onclick="goHome()">Shift uncovered?</p>
<button class="btn btn-yes" onclick="nextQ('q-staff-2')">YES</button>
<button class="btn btn-no" onclick="showResult('No call needed')">NO</button>
<button class="btn btn-reset" onclick="goBack()">Back</button>
</div>

<div id="q-staff-2" class="hidden">
<p onclick="goHome()">Store at risk of closing?</p>
<button class="btn btn-yes" onclick="showResult('Call DM','tel:'+settings.dm)">YES</button>
<button class="btn btn-no" onclick="showResult('Text DM update','sms:'+settings.dm)">NO</button>
<button class="btn btn-reset" onclick="goBack()">Back</button>
</div>

<!-- CUSTOMER -->
<div id="q-customer" class="hidden">
<p onclick="goHome()">Customer escalation unresolved?</p>
<button class="btn btn-yes" onclick="nextQ('q-customer-2')">YES</button>
<button class="btn btn-no" onclick="showResult('Handled correctly')">NO</button>
<button class="btn btn-reset" onclick="goBack()">Back</button>
</div>

<div id="q-customer-2" class="hidden">
<p onclick="goHome()">Policy exception needed?</p>
<button class="btn btn-yes" onclick="showResult('Text DM for approval','sms:'+settings.dm)">YES</button>
<button class="btn btn-no" onclick="showResult('Do not call DM')">NO</button>
<button class="btn btn-reset" onclick="goBack()">Back</button>
</div>

<!-- OPS -->
<div id="q-ops" class="hidden">
<p onclick="goHome()">Store cannot operate?</p>
<button class="btn btn-yes" onclick="showResult('Call DM immediately','tel:'+settings.dm)">YES</button>
<button class="btn btn-no" onclick="showResult('Call Help Desk','tel:'+settings.helpdesk)">NO</button>
<button class="btn btn-reset" onclick="goBack()">Back</button>
</div>

<!-- FINANCIAL -->
<div id="q-financial" class="hidden">
<p onclick="goHome()">Large variance or shortage?</p>
<button class="btn btn-yes" onclick="showResult('Text DM details','sms:'+settings.dm)">YES</button>
<button class="btn btn-no" onclick="showResult('Log and move on')">NO</button>
<button class="btn btn-reset" onclick="goBack()">Back</button>
</div>

<!-- RESULT -->
<div id="resultScreen" class="hidden">
<div id="resultMsg" class="result"></div>
<div id="actionBtn"></div>
<button class="btn btn-reset" onclick="goHome()">Home</button>
</div>

</div>

<div class="footer">Manager Version 1.01</div>

<script>
let settings = {
  dm: localStorage.getItem("dm") || "",
  helpdesk: localStorage.getItem("helpdesk") || ""
};

let historyStack=[];

const LABELS = {
  CALL_DM: "Call DM",
  TEXT_DM: "Text DM",
  CALL_HELPDESK: "Call Help Desk"
};

function showScreen(id){
document.querySelectorAll('.container > div').forEach(d=>d.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

function nextQ(id){
let current = document.querySelector('.container > div:not(.hidden)');
if(current) historyStack.push(current.id);
showScreen(id);
}

function goBack(){
if(historyStack.length){
showScreen(historyStack.pop());
}else{
goHome();
}
}

function goHome(){
historyStack=[];
showScreen("q1");
}

function showResult(msg,act){
nextQ("resultScreen");

resultMsg.innerHTML = msg;
resultMsg.className = msg.toLowerCase().includes("call") ? "result call" : "result nocall";

actionBtn.innerHTML = "";

if(act){
let a = document.createElement("a");
a.href = act;
a.className = "btn btn-blue action-btn";

if(act.startsWith("tel:")){
  if(act.includes(settings.dm)){
    a.innerText = LABELS.CALL_DM;
  } else if(act.includes(settings.helpdesk)){
    a.innerText = LABELS.CALL_HELPDESK;
  } else {
    a.innerText = "Call";
  }
}
else if(act.startsWith("sms:")){
  if(act.includes(settings.dm)){
    a.innerText = LABELS.TEXT_DM;
  } else {
    a.innerText = "Text";
  }
}

actionBtn.appendChild(a);
}
}
</script>

</body>
</html>
