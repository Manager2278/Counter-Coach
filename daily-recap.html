<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Recap</title>

<style>
body {
  font-family: Arial;
  background:#f4f4f4;
  margin:0;
  padding:10px;
}

.header {
  text-align:center;
  font-weight:bold;
  margin-bottom:10px;
}

.topbar {
  display:flex;
  gap:5px;
  margin-bottom:10px;
}

button {
  padding:10px;
  border:none;
  border-radius:8px;
  width:100%;
  font-size:15px;
}

.primary { background:#2e7d32; color:white; }
.secondary { background:#1976d2; color:white; }
.warn { background:#c62828; color:white; }

.card {
  background:white;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
}

.small {
  font-size:12px;
  color:gray;
}

.section {
  margin-top:15px;
}
</style>
</head>

<body>

<div class="header" id="header"></div>

<div class="topbar">
  <button class="secondary" onclick="goCounter()">⬅ Counter Coach</button>
  <button class="primary" onclick="showAdd()">➕ Add</button>
  <button class="warn" onclick="openManager()">🔒 Inbox</button>
</div>

<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot,
  query, orderBy, where, updateDoc, doc, deleteDoc
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyC50q5eXa...",
  authDomain: "daily-recap-v1.firebaseapp.com",
  projectId: "daily-recap-v1",
  storageBucket: "daily-recap-v1.firebasestorage.app",
  messagingSenderId: "476802421766",
  appId: "1:476802421766:web:171eccca066feb711bdf87"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// 🔗 SHARED SETTINGS
let storeNumber = localStorage.getItem("storeNumber") || "0000";
let employeeName = localStorage.getItem("employeeName") || prompt("Enter your name");
let managerPin = localStorage.getItem("managerPin") || "1234";

localStorage.setItem("employeeName", employeeName);

document.getElementById("header").innerText =
  "Store #" + storeNumber + " - Daily Recap";

const appDiv = document.getElementById("app");

// 🔙 NAVIGATION
window.goCounter = () => {
  window.location.href = "index.html";
};

// ➕ ADD SCREEN
window.showAdd = () => {
  appDiv.innerHTML = `
    <h3>Add Entry</h3>
    <button onclick="selectType('win')">🟢 Win</button>
    <button onclick="selectType('completed')">✅ Completed</button>
    <button onclick="selectType('progress')">🔄 In Progress</button>
    <button onclick="selectType('issue')">⚠️ Needs Attention</button>
    <button onclick="showInbox()">🔒 Private to Manager</button>
  `;
};

// SELECT TYPE
window.selectType = (type) => {
  appDiv.innerHTML = `
    <textarea id="desc" placeholder="What happened..." style="width:100%;height:80px;"></textarea>
    <input type="file" id="photo"><br><br>
    <button class="primary" onclick="saveEntry('${type}')">Save</button>
  `;
};

// SAVE ENTRY
window.saveEntry = async (type) => {
  const desc = document.getElementById("desc").value;
  const file = document.getElementById("photo").files[0];

  let photoURL = "";

  if (file) {
    const storageRef = ref(storage, `photos/${Date.now()}_${file.name}`);
    await uploadBytes(storageRef, file);
    photoURL = await getDownloadURL(storageRef);
  }

  await addDoc(collection(db, "recapEntries"), {
    storeNumber,
    type,
    description: desc,
    employeeName,
    photoURL,
    timestamp: Date.now(),
    status: "open",
    completedDate: null
  });

  loadEntries();
};

// 📋 LOAD ENTRIES (REALTIME + SECTIONS)
window.loadEntries = () => {
  const q = query(
    collection(db, "recapEntries"),
    where("storeNumber", "==", storeNumber),
    orderBy("timestamp", "desc")
  );

  onSnapshot(q, (snapshot) => {
    let sections = {
      progress: "",
      issue: "",
      completed: "",
      win: ""
    };

    snapshot.forEach((d) => {
      const data = d.data();

      let buttons = "";
      if (data.status !== "completed") {
        buttons = `<button onclick="markComplete('${d.id}')">✔ Complete</button>`;
      }

      let card = `
        <div class="card">
          <b>${data.description}</b><br>
          ${data.photoURL ? `<img src="${data.photoURL}" style="width:100%;margin-top:5px;border-radius:8px;">` : ""}
          <div class="small">${data.employeeName}</div>
          ${buttons}
        </div>
     `;

      sections[data.type] += card;
    });

    appDiv.innerHTML = `
      <div class="section"><h3>🔄 In Progress</h3>${sections.progress}</div>
      <div class="section"><h3>⚠️ Needs Attention</h3>${sections.issue}</div>
      <div class="section"><h3>✅ Completed</h3>${sections.completed}</div>
      <div class="section"><h3>🟢 Wins</h3>${sections.win}</div>
    `;
  });

  cleanup();
};

// ✔ COMPLETE
window.markComplete = async (id) => {
  await updateDoc(doc(db, "recapEntries", id), {
    status: "completed",
    completedDate: Date.now()
  });
};

// 🔒 PRIVATE MESSAGE
window.showInbox = () => {
  appDiv.innerHTML = `
    <textarea id="msg" placeholder="Private message to manager..." style="width:100%;height:80px;"></textarea>
    <button class="primary" onclick="saveInbox()">Send</button>
  `;
};

window.saveInbox = async () => {
  const msg = document.getElementById("msg").value;

  await addDoc(collection(db, "managerInbox"), {
    storeNumber,
    message: msg,
    employeeName,
    timestamp: Date.now(),
    status: "open"
  });

  showAdd();
};

// 🔐 MANAGER VIEW
window.openManager = () => {
  const pin = prompt("Enter Manager PIN");
  if (pin !== managerPin) return alert("Wrong PIN");

  const q = query(
    collection(db, "managerInbox"),
    where("storeNumber", "==", storeNumber),
    orderBy("timestamp", "desc")
  );

  onSnapshot(q, (snapshot) => {
    let html = "<h3>Manager Inbox</h3>";

    snapshot.forEach((d) => {
      const data = d.data();
      html += `
        <div class="card">
          ${data.message}
          <div class="small">${data.employeeName}</div>
        </div>
      `;
    });

    appDiv.innerHTML = html;
  });
};

// 🧹 AUTO CLEANUP
function cleanup() {
  const q = query(collection(db, "recapEntries"));

  onSnapshot(q, (snapshot) => {
    const now = Date.now();
    const seven = 7 * 24 * 60 * 60 * 1000;

    snapshot.forEach(async (d) => {
      const data = d.data();

      if (
        data.status === "completed" &&
        data.completedDate &&
        now - data.completedDate > seven
      ) {
        await deleteDoc(doc(db, "recapEntries", d.id));
      }
    });
  });
}

// INITIAL LOAD
loadEntries();
</script>

</body>
</html>
