<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager Counter Coach</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#006400">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; text-align:center; }
.header { background:#006400; color:white; padding:15px; border-radius:10px; margin-bottom:15px; }
.container { background:white; max-width:480px; margin:auto; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
p { font-size:18px; font-weight:bold; }
.btn { display:block; width:100%; padding:14px; margin:10px 0; font-weight:bold; border:none; border-radius:8px; }
.btn-yes{background:#2e7d32;color:white;} .btn-no{background:#c62828;color:white;}
.btn-blue{background:#1b5e20;color:white;} .btn-reset{background:#777;color:white;}
.hidden{display:none;} input{width:90%;padding:8px;margin:6px 0;}
.result{padding:20px;font-weight:bold;border-radius:8px;}
.call{background:#ffebee;color:#c62828;border:2px solid #c62828;}
.nocall{background:#e8f5e9;color:#2e7d32;border:2px solid #2e7d32;}
.footer{margin-top:15px;font-size:12px;color:#666;}
.breadcrumb span { cursor:pointer; color:#006400; }
.breadcrumb span:hover { text-decoration:underline; }
</style>
</head>

<body>

<div class="header">
<h2>Counter Coach</h2>
<div id="storeDisplay"></div>
</div>

<div class="container">

<!-- BREADCRUMB -->
<div id="breadcrumb" class="breadcrumb" style="margin-bottom:10px;"></div>

<!-- SETUP -->
<div id="setupScreen">
<h3>Store Setup</h3>
<input id="storeNum" placeholder="Store Number">
<input id="managerNum" placeholder="Manager Phone">
<input id="helpdeskNum" placeholder="Help Desk Phone">
<input id="storePin" placeholder="Create Store Admin PIN">
<button class="btn btn-yes" onclick="saveSetup()">Save & Lock Store</button>
</div>

<!-- START -->
<div id="q1" class="hidden">
<p>Immediate threat to life, safety, or building?(EMERGENCY)</p>
<button class="btn btn-yes" onclick="showResult('CALL 911 FIRST, MANAGER SECOND','tel:911')">YES</button>
<button class="btn btn-no" onclick="nextQ('q-category')">NO</button>
</div>

<div id="q-category" class="hidden">
<p>What type of issue?</p>
<button class="btn btn-blue" onclick="nextQ('q-cust')">Customer Complaint</button>
<button class="btn btn-blue" onclick="nextQ('q-staff')">Staffing / Sick Call</button>
<button class="btn btn-blue" onclick="nextQ('q-drivers')">Drivers / Delivery</button>
<button class="btn btn-blue" onclick="nextQ('q-cash-1')">Cash / Variance</button>
<button class="btn btn-blue" onclick="nextQ('q-ops')">Building / System</button>
<button class="btn btn-reset" onclick="goBack()">Back</button>
</div>

<!-- KEEP ALL YOUR OTHER QUESTION BLOCKS EXACTLY THE SAME -->
<!-- (I am not altering your logic at all — just showing one more as example) -->

<div id="q-cust" class="hidden">
<p>Customer demanding manager now?</p>
<button class="btn btn-yes" onclick="nextQ('q-cust-2')">YES</button>
<button class="btn btn-no" onclick="showResult('Handle per policy. DO NOT CALL.')">NO</button>
<button class="btn btn-reset" onclick="goBack()">Back</button>
</div>

<!-- RESULT -->
<div id="resultScreen" class="hidden">
<div id="resultMsg" class="result"></div>
<div id="actionBtn"></div>
<button class="btn btn-reset" onclick="goHome()">Home</button>
</div>

</div>

<!-- QR + ADMIN -->
<div style="max-width:480px;margin:auto;margin-top:15px;">
<div id="storeQR"></div>
<button class="btn btn-blue" onclick="openAdmin()">Admin ⚙</button>
</div>

<div class="footer">Version 3.7</div>

<script>
const DISTRICT_PIN="Manager2278";
let settings={},historyStack=[];

const labels={
q1:"Home",
"q-category":"Category",
"q-cust":"Customer",
"q-cust-2":"Key Holder",
"q-cust-3":"Resolution",
"q-staff":"Staffing",
"q-staff-2":"Coverage",
"q-drivers":"Drivers",
"q-driver-cover":"Coverage",
"q-cash-1":"Cash",
"q-cash-verify":"Verify",
"q-cash-log":"Log",
"q-ops":"Operations",
"resultScreen":"Result"
};

function updateBreadcrumb(current){
let path=[...historyStack,current];

document.getElementById("breadcrumb").innerHTML=
path.map((id,index)=>{
return `<span onclick="jumpTo(${index})">${labels[id]||id}</span>`;
}).join(" > ");
}

function jumpTo(index){
let target=historyStack[index]||"q1";
historyStack=historyStack.slice(0,index);
document.querySelectorAll('.container > div').forEach(d=>d.classList.add("hidden"));
document.getElementById(target).classList.remove("hidden");
updateBreadcrumb(target);
}

window.onload=function(){
const p=new URLSearchParams(location.search);
if(p.get("store")){
localStorage.setItem("store",p.get("store"));
localStorage.setItem("manager",p.get("manager"));
localStorage.setItem("helpdesk",p.get("helpdesk"));
localStorage.setItem("storePin",p.get("pin"));
localStorage.setItem("locked","true");
}
settings.store=localStorage.getItem("store");
settings.manager=localStorage.getItem("manager");
settings.helpdesk=localStorage.getItem("helpdesk");
settings.storePin=localStorage.getItem("storePin");
settings.locked=localStorage.getItem("locked");

if(settings.locked==="true"){
setupScreen.classList.add("hidden");
q1.classList.remove("hidden");
storeDisplay.innerHTML="Store #"+settings.store;
updateBreadcrumb("q1");

new QRCode(storeQR,{text:`https://manager2278.github.io/Counter-Coach/?store=${settings.store}&manager=${settings.manager}&helpdesk=${settings.helpdesk}&pin=${settings.storePin}`,width:150,height:150});
}
};

function saveSetup(){localStorage.setItem("store",storeNum.value);localStorage.setItem("manager",managerNum.value);localStorage.setItem("helpdesk",helpdeskNum.value);localStorage.setItem("storePin",storePin.value);localStorage.setItem("locked","true");location.reload();}
function nextQ(id){let c=document.querySelector('.container > div:not(.hidden)');if(c)historyStack.push(c.id);document.querySelectorAll('.container > div').forEach(d=>d.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");updateBreadcrumb(id);}
function goBack(){if(historyStack.length){let p=historyStack.pop();document.querySelectorAll('.container > div').forEach(d=>d.classList.add("hidden"));document.getElementById(p).classList.remove("hidden");updateBreadcrumb(p);}else goHome();}
function goHome(){historyStack=[];nextQ("q1");}
function showResult(msg,act){nextQ("resultScreen");resultMsg.innerHTML=msg;resultMsg.className=msg.includes("CALL")?"result call":"result nocall";actionBtn.innerHTML="";if(act){let a=document.createElement("a");a.href=act;a.className="btn btn-blue";a.innerText=act.startsWith("sms")?"Text":"Call";actionBtn.appendChild(a);}}
function openAdmin(){let pin=prompt("Enter Store PIN or District PIN");if(pin!==settings.storePin&&pin!==DISTRICT_PIN)alert("Incorrect PIN");}
if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script>

</body>
</html>
