<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager Counter Coach</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#006400">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; text-align:center; }
.header { background:#006400; color:white; padding:15px; border-radius:10px; margin-bottom:15px; }
.store-tag { font-size:14px; margin-top:5px; }
.container { background:white; max-width:480px; margin:auto; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
p { font-size:18px; font-weight:bold; }
.btn { display:block; width:100%; padding:14px; margin:10px 0; font-weight:bold; border:none; border-radius:8px; cursor:pointer;}
.btn-yes{background:#2e7d32;color:white;}
.btn-no{background:#c62828;color:white;}
.btn-blue{background:#1b5e20;color:white;}
.btn-reset{background:#777;color:white;}
.hidden{display:none;}
input{width:90%;padding:8px;margin:6px 0;}
.result{padding:20px;font-weight:bold;border-radius:8px;}
.call{background:#ffebee;color:#c62828;border:2px solid #c62828;}
.nocall{background:#e8f5e9;color:#2e7d32;border:2px solid #2e7d32;}
.footer{margin-top:15px;font-size:12px;color:#666;}
#banner{display:none;background:#ffc107;padding:10px;border-radius:8px;margin-bottom:10px;font-weight:bold;}
#lastSync{font-size:12px;color:#777;margin-bottom:10px;}
</style>
</head>

<body>

<div class="header">
<h2>Counter Coach</h2>
<div id="storeDisplay" class="store-tag"></div>
</div>

<div class="container">

<div id="banner"></div>
<div id="lastSync"></div>

<!-- SETUP -->
<div id="setupScreen">
<h3>Store Setup</h3>
<input id="storeNum" placeholder="Store Number">
<input id="managerNum" placeholder="Manager Phone">
<input id="helpdeskNum" placeholder="Help Desk Phone">
<input id="storePin" placeholder="Create Store Admin PIN">
<button class="btn btn-yes" onclick="saveSetup()">Save & Lock Store</button>
</div>

<!-- START -->
<div id="q1" class="hidden">
<p>Immediate threat to life, safety, or building?(EMERGENCY)</p>
<button class="btn btn-yes" onclick="showResult('CALL 911 FIRST, MANAGER SECOND','tel:911')">YES</button>
<button class="btn btn-no" onclick="nextQ('q-category')">NO</button>
</div>

<div id="q-category" class="hidden">
<p>What type of issue?</p>
<button class="btn btn-blue" onclick="nextQ('q-cust')">Customer Complaint</button>
<button class="btn btn-blue" onclick="nextQ('q-staff')">Staffing / Sick Call</button>
<button class="btn btn-blue" onclick="nextQ('q-drivers')">Drivers / Delivery</button>
<button class="btn btn-blue" onclick="nextQ('q-cash-1')">Cash / Variance</button>
<button class="btn btn-blue" onclick="nextQ('q-ops')">Building / System</button>
<button class="btn btn-reset" onclick="goBack()">Back</button>
</div>

<!-- ALL YOUR ORIGINAL QUESTION FLOWS REMAIN UNCHANGED -->

<!-- RESULT -->
<div id="resultScreen" class="hidden">
<div id="resultMsg" class="result"></div>
<div id="actionBtn"></div>
<button class="btn btn-reset" onclick="goHome()">Home</button>
</div>

<!-- STORE ADMIN PANEL -->
<div id="storeAdminPanel" class="hidden">
<h3>Store Admin Settings</h3>
<input id="editStore" placeholder="Store Number">
<input id="editManager" placeholder="Manager Phone">
<input id="editHelpdesk" placeholder="Help Desk Phone">
<button class="btn btn-yes" onclick="saveStoreAdmin()">Save</button>
<button class="btn btn-reset" onclick="goHome()">Cancel</button>
</div>

</div>

<div style="max-width:480px;margin:auto;margin-top:15px;">
<div id="storeQR"></div>
<button class="btn btn-blue" onclick="openAdmin()">Admin ⚙</button>
</div>

<div class="footer">Version 5.5 Dashboard Link</div>

<script>
const DISTRICT_PIN="Manager2278";
let settings={},historyStack=[];

function showScreen(id){
document.querySelectorAll('.container > div').forEach(d=>d.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

function runDistrictSync(){
if(navigator.onLine && settings.store){
fetch("https://manager2278.github.io/Counter-Coach/district-config.json?ts="+Date.now())
.then(r=>r.json())
.then(data=>{
let bannerMsg="";
if(data.message) bannerMsg=data.message;
if(data.stores && data.stores[settings.store]){
let u=data.stores[settings.store];
if(u.manager) localStorage.setItem("manager",u.manager);
if(u.helpdesk) localStorage.setItem("helpdesk",u.helpdesk);
if(u.message) bannerMsg=u.message;
}
if(bannerMsg){
banner.innerText=bannerMsg;
banner.style.display="block";
}
if(data.timestamp){
localStorage.setItem("lastSync",data.timestamp);
}
let last=localStorage.getItem("lastSync");
if(last){
lastSync.innerText="Last Sync: "+last;
}
}).catch(()=>{
banner.innerText="Offline Mode";
banner.style.display="block";
});
}
}

window.onload=function(){
settings.store=localStorage.getItem("store");
settings.manager=localStorage.getItem("manager");
settings.helpdesk=localStorage.getItem("helpdesk");
settings.storePin=localStorage.getItem("storePin");
settings.locked=localStorage.getItem("locked");

if(settings.locked==="true"){
setupScreen.classList.add("hidden");
showScreen("q1");
storeDisplay.innerHTML="Store #"+settings.store;
runDistrictSync();
  
setInterval(()=>{
fetch("https://manager2278.github.io/Counter-Coach/district-config.json")
.then(r=>r.json())
.then(data=>{
data.heartbeat = data.heartbeat || {};
data.heartbeat[settings.store] = Date.now();

// send back (optional advanced later)
});
}, 60000);
  
new QRCode(document.getElementById("storeQR"),{
text:`https://manager2278.github.io/Counter-Coach/?store=${settings.store}&manager=${settings.manager}&helpdesk=${settings.helpdesk}&pin=${settings.storePin}`,
width:150,height:150
});
}
};

function saveSetup(){
if(!storeNum.value || !managerNum.value || !helpdeskNum.value || !storePin.value){
alert("All fields required"); return;
}

localStorage.setItem("store",storeNum.value);
localStorage.setItem("manager",managerNum.value);
localStorage.setItem("helpdesk",helpdeskNum.value);
localStorage.setItem("storePin",storePin.value);
localStorage.setItem("locked","true");

settings.store = storeNum.value;
settings.manager = managerNum.value;
settings.helpdesk = helpdeskNum.value;
settings.storePin = storePin.value;
settings.locked = "true";

document.querySelectorAll('.container > div').forEach(d=>d.classList.add("hidden"));
document.getElementById("q1").classList.remove("hidden");
document.getElementById("setupScreen").classList.add("hidden");

storeDisplay.innerHTML = "Store #" + settings.store;

runDistrictSync();

const qrEl=document.getElementById("storeQR");
if(qrEl){
qrEl.innerHTML="";
new QRCode(qrEl,{
text:`https://manager2278.github.io/Counter-Coach/?store=${settings.store}&manager=${settings.manager}&helpdesk=${settings.helpdesk}&pin=${settings.storePin}`,
width:150,height:150
});
}
}

function nextQ(id){
let current=document.querySelector('.container > div:not(.hidden)');
if(current) historyStack.push(current.id);
showScreen(id);
}

function goBack(){
if(historyStack.length){
showScreen(historyStack.pop());
}else{
goHome();
}
}

function goHome(){
historyStack=[];
showScreen("q1");
}

function showResult(msg,act){
nextQ("resultScreen");
resultMsg.innerHTML=msg;
resultMsg.className=msg.toLowerCase().includes("call")?"result call":"result nocall";
actionBtn.innerHTML="";
if(act){
let a=document.createElement("a");
a.href=act;
a.className="btn btn-blue";
a.innerText=act.startsWith("sms")?"Text":"Call";
actionBtn.appendChild(a);
}
}

function openAdmin(){
let pin = prompt("Enter Store PIN or District PIN");

if(pin === settings.storePin){
nextQ("storeAdminPanel");
editStore.value=settings.store;
editManager.value=settings.manager;
editHelpdesk.value=settings.helpdesk;
}
else if(pin === DISTRICT_PIN){
window.location.href = "district-dashboard.html";
}
else{
alert("Incorrect PIN");
}
}

function saveStoreAdmin(){
localStorage.setItem("store",editStore.value);
localStorage.setItem("manager",editManager.value);
localStorage.setItem("helpdesk",editHelpdesk.value);
alert("Saved");
location.reload();
}
</script>

</body>
</html>
