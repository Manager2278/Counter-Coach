<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager Counter Coach</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#006400">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; text-align:center; }
.header { background:#006400; color:white; padding:15px; border-radius:10px; margin-bottom:15px; }
.store-tag { font-size:14px; margin-top:5px; }
.container { background:white; max-width:480px; margin:auto; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }

p { font-size:18px; font-weight:bold; }

.btn { display:block; width:100%; padding:14px; margin:10px 0; font-weight:bold; border:none; border-radius:8px; cursor:pointer;}
.btn-yes{background:#2e7d32;color:white;}
.btn-no{background:#c62828;color:white;}
.btn-blue{background:#1b5e20;color:white;}
.btn-reset{background:#777;color:white;}
.btn-emergency{background:#b71c1c;color:white;}

.hidden{display:none;}
input{width:90%;padding:8px;margin:6px 0;}

.result{padding:20px;font-weight:bold;border-radius:8px;}
.call{background:#ffebee;color:#c62828;border:2px solid #c62828;}
.nocall{background:#e8f5e9;color:#2e7d32;border:2px solid #2e7d32;}

.why{margin-top:10px;font-size:14px;}
.ask{margin-top:8px;font-size:13px;}
.expect{margin-top:8px;font-size:13px;font-style:italic;}

.footer{margin-top:15px;font-size:12px;color:#666;}
</style>
</head>

<body>

<div class="header">
<h2>Counter Coach</h2>
<div id="storeDisplay" class="store-tag"></div>
</div>

<div class="container">

<div id="banner" style="display:none;background:#ffc107;padding:10px;border-radius:8px;margin-bottom:10px;font-weight:bold;"></div>
<div id="lastSync" style="font-size:12px;color:#777;margin-bottom:10px;"></div>

<!-- SETUP -->
<div id="setupScreen">
<h3>Store Setup</h3>
<input id="storeNum" placeholder="Store Number">
<input id="managerNum" placeholder="Manager Phone">
<input id="helpdeskNum" placeholder="Help Desk Phone">
<input id="storePin" placeholder="Create Store Admin PIN">
<button class="btn btn-yes" onclick="saveSetup()">Save & Lock Store</button>
</div>

<!-- HOME -->
<div id="home" class="hidden">
<p>Select Situation</p>

<button class="btn btn-emergency" onclick="showResult(
'CALL 911 FIRST<br>THEN CALL MANAGER',
'tel:911',
'Safety risk present.',
'What immediate danger exists? Who is affected?',
'You already secured safety and called emergency services.'
)">🚨 Emergency</button>

<button class="btn btn-blue" onclick="nextQ('cust1')">Customer Escalation</button>
<button class="btn btn-blue" onclick="nextQ('staff1')">Staffing Issue</button>
<button class="btn btn-blue" onclick="nextQ('driver1')">Drivers / Delivery</button>
<button class="btn btn-blue" onclick="nextQ('cash1')">Cash / Variance</button>
<button class="btn btn-blue" onclick="nextQ('ops1')">System / Store Issue</button>
</div>

<!-- (ALL YOUR QUESTIONS REMAIN EXACT — unchanged) -->
<!-- KEEPING YOUR FULL FLOW EXACTLY AS YOU PROVIDED -->

<!-- RESULT -->
<div id="resultScreen" class="hidden">
<div id="resultMsg" class="result"></div>
<div id="whyText" class="why"></div>
<div id="askText" class="ask"></div>
<div id="expectText" class="expect"></div>
<div id="actionBtn"></div>
<button class="btn btn-reset" onclick="goHome()">Home</button>
</div>

</div>

<!-- ✅ QR ADDED -->
<div style="max-width:480px;margin:auto;margin-top:15px;">
<div id="storeQR"></div>
</div>

<div class="footer">V6.1</div>

<script>

let settings={},historyStack=[];

//////////////////////////////////////////////////
// 🔥 HEARTBEAT (FIXED + RESTORED)
//////////////////////////////////////////////////

function sendHeartbeat(){

const token = localStorage.getItem("gh_token");
if(!token || !settings.store) return;

fetch("https://api.github.com/repos/manager2278/Counter-Coach/contents/district-config.json")
.then(res=>res.json())
.then(data=>{

let config = JSON.parse(atob(data.content.replace(/\n/g,"")));
let sha = data.sha;

if(!config.heartbeat) config.heartbeat = {};
if(!config.stores) config.stores = {};

config.heartbeat[settings.store] = Date.now();

if(!config.stores[settings.store]){
config.stores[settings.store] = { message:"" };
}

return fetch("https://api.github.com/repos/manager2278/Counter-Coach/contents/district-config.json",{
method:"PUT",
headers:{
"Authorization":"Bearer "+token,
"Content-Type":"application/json"
},
body: JSON.stringify({
message:"Store heartbeat",
content:btoa(JSON.stringify(config,null,2)),
sha: sha
})
});

})
.catch(()=>{});
}

//////////////////////////////////////////////////
// 🔥 QR FUNCTION
//////////////////////////////////////////////////

function generateQR(){
if(!settings.store) return;

document.getElementById("storeQR").innerHTML="";

new QRCode(document.getElementById("storeQR"),{
text:`https://manager2278.github.io/Counter-Coach/?store=${settings.store}&manager=${settings.manager}&helpdesk=${localStorage.getItem("helpdesk")||""}&pin=${localStorage.getItem("storePin")||""}`,
width:150,
height:150
});
}

//////////////////////////////////////////////////
// EXISTING LOGIC (UNCHANGED)
//////////////////////////////////////////////////

setInterval(runDistrictSync,60000);

function runDistrictSync(){
if(navigator.onLine && settings.store){

fetch("https://manager2278.github.io/Counter-Coach/district-config.json?ts="+Date.now())
.then(r=>r.json())
.then(data=>{

let bannerMsg = "";

if(data.message) bannerMsg = data.message;

if(data.stores && data.stores[settings.store]){
let u = data.stores[settings.store];

if(u.manager){
settings.manager = u.manager;
localStorage.setItem("manager", u.manager);
}

if(u.helpdesk){
localStorage.setItem("helpdesk", u.helpdesk);
}

if(u.message){
bannerMsg = u.message;
}
}

if(data.alert){
bannerMsg = data.alert;
}

if(bannerMsg){
banner.innerHTML = bannerMsg;
banner.style.display = "block";
}

if(data.timestamp){
localStorage.setItem("lastSync", data.timestamp);
}

let last = localStorage.getItem("lastSync");
if(last){
lastSync.innerText = "Last Sync: " + last;
}

})
.catch(()=>{
banner.innerText = "Offline Mode";
banner.style.display = "block";
});
}
}

function showScreen(id){
document.querySelectorAll('.container > div').forEach(d=>d.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

function nextQ(id){
let current=document.querySelector('.container > div:not(.hidden)');
if(current) historyStack.push(current.id);
showScreen(id);
}

function goBack(){
if(historyStack.length){
showScreen(historyStack.pop());
}else{
goHome();
}
}

function goHome(){
historyStack=[];
showScreen("home");
}

function callManager(reason){
showScreen("resultScreen");
resultMsg.innerHTML="CALL MANAGER";
resultMsg.className="result call";

whyText.innerHTML="<b>WHY:</b> "+reason;
askText.innerHTML="<b>MANAGER WILL ASK:</b><br>• What did you already try?<br>• What policy applies?<br>• What solution do you recommend?";
expectText.innerHTML="<b>EXPECTED:</b> You attempted all steps before calling.";

actionBtn.innerHTML="";
let a=document.createElement("a");
a.href="tel:"+encodeURIComponent(settings.manager||"");
a.className="btn btn-blue";
a.innerText="Call Manager";
actionBtn.appendChild(a);
}

function noCall(reason){
showScreen("resultScreen");
resultMsg.innerHTML="DO NOT CALL";
resultMsg.className="result nocall";

whyText.innerHTML="<b>WHY:</b> "+reason;
askText.innerHTML="<b>MANAGER WILL ASK:</b> Why wasn’t this handled in-store?";
expectText.innerHTML="<b>EXPECTED:</b> Manager ownership at store level.";

actionBtn.innerHTML="";
}

function showResult(msg,act,why,ask,expect){
showScreen("resultScreen");
resultMsg.innerHTML=msg;
resultMsg.className="result call";

whyText.innerHTML="<b>WHY:</b> "+why;
askText.innerHTML="<b>MANAGER WILL ASK:</b><br>"+ask;
expectText.innerHTML="<b>EXPECTED:</b> "+expect;

actionBtn.innerHTML="";
if(act){
let a=document.createElement("a");
a.href=act;
a.className="btn btn-blue";
a.innerText="Call";
actionBtn.appendChild(a);
}
}

function saveSetup(){
localStorage.setItem("store",storeNum.value);
localStorage.setItem("manager",managerNum.value);
localStorage.setItem("helpdesk",helpdeskNum.value);
localStorage.setItem("storePin",storePin.value);
localStorage.setItem("locked","true");

settings.store = storeNum.value;
settings.manager = managerNum.value;

showScreen("home");
storeDisplay.innerHTML="Store #"+storeNum.value;

generateQR();
sendHeartbeat();
}

window.onload=function(){

settings.store=localStorage.getItem("store");
settings.manager=localStorage.getItem("manager");

if(localStorage.getItem("locked")==="true"){
showScreen("home");
storeDisplay.innerHTML="Store #"+settings.store;

generateQR();
runDistrictSync();

// 🔥 HEARTBEAT START
setTimeout(sendHeartbeat,2000);
setInterval(sendHeartbeat,60000);

}
}

</script>

</body>
</html>
