<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>District Dashboard</title>
<style>
body { font-family: Arial; padding:20px; max-width:500px; margin:auto; }
input, textarea, select { width:100%; margin:5px 0; padding:8px; }
button { padding:10px; margin-top:10px; width:100%; }
.status { font-size:12px; color:#666; margin-bottom:10px; }
</style>
</head>
<body>

<h2>District Control Panel</h2>

<div id="status" class="status">Loading...</div>

<h3>🔐 GitHub Token</h3>
<input id="token" placeholder="Paste GitHub Token">

<h3>Global Message</h3>
<textarea id="message"></textarea>

<h3>Store Message</h3>

<select id="storeSelect"></select>
<input id="storeManual" placeholder="Or Enter Store">
<input id="storeMessage" placeholder="Store Message">

<button onclick="addStore()">Add / Update Store</button>

<hr>

<h3>Reset Store</h3>
<select id="resetSelect"></select>
<button onclick="addReset()">Add Reset</button>

<hr>

<button onclick="saveToGitHub()">💾 Save to GitHub</button>

<script>
let config = {};
let sha = "";

const REPO = "manager2278/Counter-Coach";
const FILE = "district-config.json";

// 🔄 LOAD CONFIG
window.onload = function(){
fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`)
.then(res => res.json())
.then(data => {
  sha = data.sha;
  config = JSON.parse(atob(data.content));

  message.value = config.message || "";

  populateDropdowns();
  status.innerText = "Loaded config";

})
.catch(() => {
  config = {stores:{},resetStores:[],message:""};
  status.innerText = "New config started";
});
};

function populateDropdowns(){
storeSelect.innerHTML = `<option value="">-- Select Store --</option>`;
resetSelect.innerHTML = `<option value="">-- Select Store --</option>`;

Object.keys(config.stores || {}).forEach(s=>{
  storeSelect.innerHTML += `<option value="${s}">Store ${s}</option>`;
  resetSelect.innerHTML += `<option value="${s}">Store ${s}</option>`;
});
}

function getStore(){
return storeSelect.value || storeManual.value;
}

function addStore(){
let s = getStore();
if(!s) return alert("Enter store");

if(!config.stores) config.stores = {};

config.stores[s] = {
  ...config.stores[s],
  message: storeMessage.value
};

populateDropdowns();
}

function addReset(){
let s = resetSelect.value;
if(!s) return alert("Select store");

if(!config.resetStores) config.resetStores = [];

if(!config.resetStores.includes(s)){
config.resetStores.push(s);
}
}

function saveToGitHub(){
let tokenVal = token.value;
if(!tokenVal) return alert("Enter token");

config.message = message.value;
config.timestamp = new Date().toLocaleString();

fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{
method:"PUT",
headers:{
"Authorization":"token " + tokenVal,
"Content-Type":"application/json"
},
body: JSON.stringify({
message: "Update district config",
content: btoa(JSON.stringify(config,null,2)),
sha: sha
})
})
.then(res=>res.json())
.then(()=>{
status.innerText = "✅ Saved successfully";
})
.catch(()=>{
alert("Save failed");
});
}
</script>

</body>
</html>
