<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>District Command Center</title>

<style>
body { font-family: Arial; padding:20px; max-width:600px; margin:auto; }
input, textarea, select { width:100%; margin:5px 0; padding:8px; }
button { padding:10px; margin-top:10px; width:100%; }
.status { font-size:12px; color:#666; margin-bottom:10px; }
.panel { background:#f4f4f4; padding:10px; margin-top:10px; border-radius:8px; }
.store { padding:5px; border-bottom:1px solid #ddd; font-size:14px; }
.alertBox { background:#ffcccc; padding:10px; border-radius:8px; margin-bottom:10px; }
.summary { font-weight:bold; margin-bottom:10px; }
.problem { background:#ffe0e0; }
</style>

</head>
<body>

<h2>🔥 District Command Center</h2>
<div id="status" class="status">Loading...</div>

<h3>🔐 Token</h3>
<input id="token">

<h3>📢 GLOBAL MESSAGE</h3>
<textarea id="message"></textarea>

<h3>🚨 LIVE ALERT</h3>
<textarea id="alertMsg"></textarea>
<button onclick="sendAlert()">Push Alert</button>
<button onclick="clearAlert()">Clear Alert</button>

<div class="alertBox" id="activeAlert"></div>

<hr>

<h3>🏪 STORE STATUS</h3>
<div id="storeSummary" class="summary"></div>
<div id="storeStatus" class="panel"></div>

<hr>

<h3>⚠️ TOP PROBLEM STORES</h3>
<div id="problemStores" class="panel"></div>

<hr>

<h3>🔁 FORCE RESET</h3>
<select id="resetSelect"></select>
<button onclick="addReset()">Reset Store</button>

<hr>

<button onclick="save()">💾 SAVE ALL</button>

<script>
let config = {};
let sha = "";
let lastAlertSeen = "";

const REPO = "manager2278/Counter-Coach";
const FILE = "district-config.json";

// 🔔 REQUEST NOTIFICATION PERMISSION
if ("Notification" in window) {
Notification.requestPermission();
}

// LOAD
window.onload = function(){

token.value = localStorage.getItem("gh_token") || "";

fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`)
.then(res=>res.json())
.then(data=>{

sha = data.sha;
config = JSON.parse(atob(data.content.replace(/\n/g,"")));

if(!config.stores) config.stores = {};
if(!config.heartbeat) config.heartbeat = {};
if(!config.resetStores) config.resetStores = [];

Object.keys(config.heartbeat).forEach(s=>{
  if(!config.stores[s]){
    config.stores[s] = { message: "" };
  }
});

message.value = config.message || "";
alertMsg.value = config.alert || "";

lastAlertSeen = config.alert || "";

renderStores();

status.innerText = "Loaded";

}).catch(()=>{
config = {stores:{},resetStores:[],heartbeat:{}};
status.innerText = "New config";
});
};

// STORE STATUS + PROBLEM STORES
function renderStores(){
let html="";
let problems="";
let now = Date.now();
let active = 0;
let total = Object.keys(config.heartbeat || {}).length;

let problemList = [];

Object.keys(config.heartbeat || {}).forEach(s=>{
let last = config.heartbeat[s];
let diff = Math.floor((now - last)/60000);

if(diff < 5) active++;

let statusTxt = diff < 5 ? "🟢 Active" : "🔴 Offline";

html += `<div class="store">
Store ${s} — ${statusTxt} (${diff} min ago)
</div>`;

// track problems
problemList.push({store:s, mins:diff});
});

// sort worst stores
problemList.sort((a,b)=>b.mins - a.mins);

// show top 5 problems
problemList.slice(0,5).forEach(p=>{
problems += `<div class="store problem">
Store ${p.store} — ${p.mins} min offline
</div>`;
});

storeStatus.innerHTML = html || "No stores reporting";
problemStores.innerHTML = problems || "No issues";
storeSummary.innerText = `Active: ${active} / ${total}`;

resetSelect.innerHTML = "";
Object.keys(config.heartbeat || {}).forEach(s=>{
resetSelect.innerHTML += `<option value="${s}">Store ${s}</option>`;
});

activeAlert.innerText = config.alert ? "ACTIVE ALERT: " + config.alert : "";
}

// 🔔 PUSH ALERT
function sendAlert(){
config.alert = alertMsg.value;
save();
}

function clearAlert(){
alertMsg.value = "";
config.alert = "";
save();
}

// RESET
function addReset(){
let s = resetSelect.value;

if(!config.resetStores.includes(s)){
config.resetStores.push(s);
alert("Reset sent to Store " + s);
}

save();
}

// SAVE
function save(){

let t = token.value;
if(!t) return alert("Token required");

localStorage.setItem("gh_token", t);

config.message = message.value;
config.timestamp = new Date().toLocaleString();

fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{
method:"PUT",
headers:{
"Authorization":"Bearer "+t,
"Content-Type":"application/json"
},
body: JSON.stringify({
message:"District update",
content:btoa(JSON.stringify(config,null,2)),
...(sha && { sha })
})
})
.then(r=>{
if(!r.ok) throw new Error("Save failed");
return r.json();
})
.then(data=>{
sha = data.content.sha;
status.innerText="✅ Saved";
})
.catch(()=>{
status.innerText="❌ Error";
});
}

// 🔴 LIVE SYNC + PUSH NOTIFICATIONS
function runLiveSync(){

fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`)
.then(res=>res.json())
.then(data=>{

let newConfig = JSON.parse(atob(data.content.replace(/\n/g,"")));

config.heartbeat = newConfig.heartbeat || {};
config.alert = newConfig.alert || "";
config.stores = newConfig.stores || {};

renderStores();

// 🔔 notify if alert changed
if(config.alert && config.alert !== lastAlertSeen){

if(Notification.permission === "granted"){
new Notification("🚨 District Alert", {
body: config.alert
});
}

lastAlertSeen = config.alert;
}

})
.catch(()=>{});
}

// run every 10 sec
setInterval(runLiveSync, 10000);

</script>

</body>
</html>
