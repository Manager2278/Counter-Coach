<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager Decision Coach - DM Edition</title>

<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; text-align:center; }
.header { background:#006400; color:white; padding:15px; border-radius:10px; margin-bottom:15px; }
.container { background:white; max-width:480px; margin:auto; padding:25px; border-radius:12px; }

p { font-size:17px; font-weight:bold; }

.btn { width:100%; padding:14px; margin:10px 0; border:none; border-radius:8px; font-weight:bold; cursor:pointer;}
.btn-emergency{background:#b71c1c;color:white;}
.btn-blue{background:#1b5e20;color:white;}
.btn-yes{background:#2e7d32;color:white;}
.btn-no{background:#c62828;color:white;}
.btn-reset{background:#777;color:white;}

.hidden{display:none;}

.result{padding:20px;border-radius:8px;}
.call{background:#ffebee;color:#c62828;border:2px solid #c62828;}
.nocall{background:#e8f5e9;color:#2e7d32;border:2px solid #2e7d32;}

.dm {
  margin-top:10px;
  font-size:15px;
}

.answer {
  margin-top:10px;
  font-size:14px;
}

.why{
margin-top:12px;
font-size:18px;
font-weight:bold;
line-height:1.4;
}

.ask{
margin-top:10px;
font-size:15px;
line-height:1.4;
}

.expect{
margin-top:12px;
font-size:17px;
font-weight:bold;
font-style:italic;
line-height:1.4;
}

.why{ color:#b71c1c; }      /* red = problem */
.expect{ color:#1b5e20; }   /* green = action */

/* ✅ FIXES */
.answer.expect { color:#1b5e20; }
.why.expect { color:#1b5e20; }

</style>
</head>

<body>

<div class="header">
<h2>Manager Decision Coach</h2>
<div>2 Possible Solutions Before Calling DM</div>
</div>

<div class="container">

<div id="home">
<p>Select Situation</p>

<button class="btn btn-emergency" onclick="callEmergency()">🚨 Emergency</button>

<button class="btn btn-blue" onclick="nextQ('cust1')">Customer Escalation</button>
<button class="btn btn-blue" onclick="nextQ('staff1')">Staffing Issue</button>
<button class="btn btn-blue" onclick="nextQ('ops1')">System / Store Issue</button>
<button class="btn btn-blue" onclick="nextQ('cash1')">Cash / Variance</button>
<button class="btn btn-blue" onclick="nextQ('delivery1')">Driver / Delivery</button>
<button class="btn btn-blue" onclick="nextQ('policy1')">Policy Question</button>
</div>

<!-- (ALL YOUR FLOW REMAINS EXACTLY THE SAME — unchanged) -->

<div id="result" class="hidden">
<div id="resultMsg" class="result"></div>
<div id="whyText" class="why"></div>
<div id="dmText" class="dm"></div>
<div id="answerText" class="answer"></div>
<button class="btn btn-reset" onclick="goHome()">Home</button>
</div>

<button class="btn btn-reset" onclick="goBack()">Back</button>

</div>

<script>
let historyStack=[];

function showScreen(id){
document.querySelectorAll('.container > div').forEach(d=>d.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

function nextQ(id){
let current=document.querySelector('.container > div:not(.hidden)');
if(current) historyStack.push(current.id);
showScreen(id);
}

function goHome(){
historyStack=[];
showScreen("home");
}

function callEmergency(){
showScreen("result");
resultMsg.innerHTML="CALL 911 THEN CALL DM";
resultMsg.className="result call";

whyText.className="why";
whyText.innerHTML="<b>WHY:</b> Life safety situation";

dmText.innerHTML="<b>DM WILL ASK:</b> What happened and who is impacted?";

answerText.className="answer expect";
answerText.innerHTML="Emergency handled, authorities contacted.";
}

function callDM(reason){
showScreen("result");

resultMsg.innerHTML="CALL DM";
resultMsg.className="result call";

whyText.className="why"; // 🔴
whyText.innerHTML="<b>WHY:</b> "+reason;

answerText.className="answer expect";

dmText.innerHTML = `
<b>DM WILL ASK:</b><br>
• What have you already done?<br>
• What policy applies?<br>
• What is your recommendation?<br>
• What is the impact?
`;

answerText.innerHTML = `
<b>RECOMMENDED ANSWER:</b><br>
Situation: ${reason}<br>
Actions taken: Be specific (who, what, when)<br>
Policy: (reference)<br>
Recommendation: (your solution)<br>
Impact: (sales/staff/customer)
`;
}

function noCall(reason){
showScreen("result");

resultMsg.innerHTML="DO NOT CALL DM";
resultMsg.className="result nocall";

whyText.className="why expect"; // 🟢
whyText.innerHTML="<b>WHY:</b> "+reason;

dmText.innerHTML="<b>EXPECTATION:</b> Manager ownership required";

answerText.className="answer expect";
answerText.innerHTML="";
}

function goBack(){
if(historyStack.length){
showScreen(historyStack.pop());
}else{
goHome();
}
}

showScreen("home");
</script>

</body>
</html>
